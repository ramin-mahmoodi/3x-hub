/* legend icons: tinted badge in the same colour as its part of the usage bar */
.legend .lg{--lc:var(--muted);width:2rem;height:2rem;border-radius:11px;display:grid;place-items:center;flex:none;opacity:1;box-shadow:none;
  color:var(--lc);background:color-mix(in srgb,var(--lc) 18%,transparent)}
.legend .lg svg{width:1.05rem;height:1.05rem;display:block}
.legend .lg-down{--lc:var(--c-down)}.legend .lg-up{--lc:var(--c-up)}.legend .lg-rem{--lc:var(--muted)}

/* account-detail icons: a different colour each */
.details li .di{--dc:var(--a1);color:var(--dc);background:color-mix(in srgb,var(--dc) 16%,transparent)}
.details li:nth-child(1) .di{--dc:#2fcf7a}
.details li:nth-child(2) .di{--dc:#5fe0d2}
.details li:nth-child(3) .di{--dc:#b69cff}
.details li:nth-child(4) .di{--dc:#ff9b80}
.details li:nth-child(5) .di{--dc:#ffd21f}
html[data-theme="light"] .details li:nth-child(1) .di{--dc:#16a34a}
html[data-theme="light"] .details li:nth-child(2) .di{--dc:#12b5a5}
html[data-theme="light"] .details li:nth-child(3) .di{--dc:#7c5cff}
html[data-theme="light"] .details li:nth-child(4) .di{--dc:#ff6f4d}
html[data-theme="light"] .details li:nth-child(5) .di{--dc:#e0a000}
.appc-ic.real{border:1px solid var(--line)}.appc-ic.real{padding:.55rem}.appc-ic.gl.real svg,.appc-ic.gl.real svg.wide,.appc-ic.gl.real svg.full,.appc-ic.gl.real svg.word{width:100%;height:100%;display:block}html:not([data-theme="light"]) .appc-ic.gl.real{background:#1c2536!important;color:#f3f4f6}html[data-theme="light"] .appc-ic.gl.real{color:#111827}

/* ===== palette: day sky / night sky — mirrors the theme switch ===== */
:root{
  --font:'Vazirmatn',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --bg:#0b1220;--bg2:#15213a;
  --card:rgba(17,27,48,.8);
  --card-strong:#1b2a48;
  --well:rgba(4,10,24,.5);
  --line:rgba(160,185,235,.17);
  --text:#f4f7ff;--text2:#b9c6e2;--muted:#8294b8;
  --sun:#ffd21f;--moon:#f2f5fc;
  --a1:#7fb0ff;--a2:#ffd21f;--a3:#e9eefb;
  --grad:linear-gradient(135deg,#4f8dff,#7fb0ff);
  --act-bg:linear-gradient(180deg,#ffffff,#d3ddf4);--act-fg:#0b1220;
  --grad-text:linear-gradient(135deg,#ffffff,#a9c6ff);
  --g1:#7fb0ff;--g2:#b9d2ff;--g3:#f4f7ff;
  --c-down:#5fe0d2;--c-up:#b69cff;
  --track:rgba(255,255,255,.09);
  --card-shadow:0 18px 40px -22px rgba(0,0,0,.85);
  --shadow:var(--card-shadow);
  --ok:#4ade80;--bad:#fb7185;--warn:#fbbf24;
  --r:28px;
}
html[data-theme="light"]{
  --bg:#f7faff;--bg2:#e8f0ff;
  --card:rgba(255,255,255,.8);
  --card-strong:#eef4ff;
  --well:rgba(33,150,243,.08);
  --line:rgba(33,110,200,.17);
  --text:#0b1a33;--text2:#35496e;--muted:#6a7da2;
  --a1:#1e88e5;--a2:#f5b700;--a3:#1565c0;
  --grad:linear-gradient(135deg,#42a5f5,#1e88e5);
  --act-bg:linear-gradient(180deg,#42a5f5,#1e88e5);--act-fg:#fff;
  --grad-text:linear-gradient(135deg,#1565c0,#2196f3);
  --g1:#1565c0;--g2:#1e88e5;--g3:#4fb3ff;
  --c-down:#12b5a5;--c-up:#7c5cff;
  --track:rgba(33,150,243,.15);
  --card-shadow:0 14px 34px -18px rgba(21,90,170,.5);
  --ok:#15803d;--bad:#dc2626;
}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{
  font-family:var(--font);color:var(--text);min-height:100vh;line-height:1.7;
  background:linear-gradient(160deg,var(--bg),var(--bg2));
  padding:clamp(.9rem,2.4vw,2rem);
}

.wrap{width:min(100%,1180px);margin-inline:auto;display:grid;gap:1.1rem}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:var(--shadow);
}
.pad{padding:clamp(1.1rem,2.2vw,1.6rem)}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:1rem;min-width:0}
.logo{
  width:3.4rem;height:3.4rem;border-radius:18px;background:var(--grad);display:grid;place-items:center;flex:none;
  box-shadow:0 10px 30px -8px var(--a1);
}
.logo svg{width:1.7rem;height:1.7rem;color:#fff}
.brand h1{font-size:clamp(1.25rem,2.6vw,1.75rem);font-weight:800;line-height:1.3;letter-spacing:-.02em}
.who{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;margin-top:.15rem;color:var(--text2);font-size:.85rem}
.tools{display:flex;gap:.5rem}
.ibtn{
  width:2.7rem;height:2.7rem;border-radius:14px;border:1px solid var(--line);background:var(--card-strong);
  color:var(--text);display:grid;place-items:center;cursor:pointer;transition:.18s;font:inherit;font-weight:700;font-size:.8rem
}
.ibtn:hover{transform:translateY(-2px);border-color:var(--a2)}
.ibtn svg{width:1.15rem;height:1.15rem}

.chip{display:inline-flex;align-items:center;gap:.4rem;padding:.2rem .75rem;border-radius:99px;font-size:.78rem;font-weight:700;border:1px solid transparent}
.chip.on{background:rgba(52,211,153,.14);color:var(--ok);border-color:rgba(52,211,153,.35)}
.chip.off{background:rgba(251,113,133,.14);color:var(--bad);border-color:rgba(251,113,133,.35)}
.chip.neutral{background:var(--card-strong);color:var(--text2);border-color:var(--line)}
.dot{width:.5rem;height:.5rem;border-radius:50%;background:currentColor;position:relative}
.dot.pulse::after{display:none}
@keyframes ping{to{transform:scale(3.2);opacity:0}}

.announce{
  display:none;align-items:flex-start;gap:.75rem;padding:.9rem 1.1rem;border-radius:16px;
  background:linear-gradient(135deg,rgba(139,92,246,.18),rgba(34,211,238,.14));border:1px solid var(--line);font-size:.92rem
}
.announce.show{display:flex}
.announce svg{width:1.25rem;height:1.25rem;flex:none;margin-top:.2rem;color:var(--a2)}

/* pages (tabs) */
.nav{
  display:flex;gap:.35rem;padding:.35rem;border-radius:18px;background:var(--card);border:1px solid var(--line);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:var(--shadow);width:100%
}
.nav-btn{
  flex:1;display:inline-flex;align-items:center;justify-content:center;gap:.5rem;padding:.7rem 1.25rem;border-radius:14px;border:0;background:transparent;
  color:var(--text2);cursor:pointer;font:inherit;font-weight:700;font-size:.88rem;transition:.2s;white-space:nowrap
}
.nav-btn svg{width:1.15rem;height:1.15rem;flex:none}
.nav-btn:hover{color:var(--text)}
.nav-btn.active{background:var(--grad);color:#fff;box-shadow:0 8px 22px -8px var(--a1)}
html{overflow-x:hidden}
.wrap{position:relative;grid-template-columns:minmax(0,1fr)}
.page{min-width:0;grid-template-columns:minmax(0,1fr)}
.page{display:none;gap:1.1rem}
.page.active{display:grid;animation:pgIn .32s cubic-bezier(.32,.72,0,1) both}
.page.leaving{display:grid;position:absolute;left:0;right:0;pointer-events:none;animation:pgOut .32s cubic-bezier(.32,.72,0,1) both}
@keyframes pgIn{from{opacity:0;transform:translateX(var(--pg-x,0px))}to{opacity:1;transform:none}}
@keyframes pgOut{from{opacity:1;transform:none}to{opacity:0;transform:translateX(var(--pg-out,0px))}}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1.1rem;align-items:stretch}
.two>*{min-width:0}

/* gauge */
.gauge-box{display:grid;place-items:center;gap:1.1rem;text-align:center}
.gauge{position:relative;width:min(100%,15rem);aspect-ratio:1}
.gauge svg{width:100%;height:100%;transform:rotate(-90deg)}
.gauge .track{stroke:var(--line)}
.gauge .bar{stroke:url(#g);stroke-linecap:round;transition:stroke-dashoffset 1.1s cubic-bezier(.2,.8,.2,1)}
.gauge-center{position:absolute;inset:0;display:grid;place-content:center}
.pct{font-size:2.6rem;font-weight:800;line-height:1;letter-spacing:-.03em;direction:ltr}
.pct small{font-size:1.1rem;font-weight:600;color:var(--text2)}
.gauge-center>span{font-size:.78rem;color:var(--muted);margin-top:.3rem}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:.7rem;width:100%}
.mini{padding:.8rem;border-radius:16px;background:var(--card-strong);border:1px solid var(--line)}
.mini b{display:block;font-size:1.02rem;direction:ltr;font-weight:700}
.mini span{font-size:.74rem;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:.3rem}
.mini svg{width:.85rem;height:.85rem}

/* stat tiles */
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.8rem}
.tile{padding:1rem 1.1rem;border-radius:18px;background:var(--card);border:1px solid var(--line);box-shadow:none}
.tile .l{font-size:.78rem;color:var(--muted);display:flex;align-items:center;gap:.4rem}
.tile .l i{width:.5rem;height:.5rem;border-radius:50%;display:block}
.tile .v{font-size:1.35rem;font-weight:800;margin-top:.3rem;direction:ltr;text-align:start;letter-spacing:-.02em;word-break:break-word}
.tile:nth-child(1) i{background:var(--a1)}
.tile:nth-child(2) i{background:var(--a2)}
.tile:nth-child(3) i{background:var(--a3)}

/* hero */
.hero{position:relative;overflow:hidden;padding:clamp(1.2rem,2.6vw,2rem)}
.hero-glow{position:absolute;inset:-40% auto auto -10%;width:55%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,rgba(139,92,246,.35),transparent 65%);pointer-events:none;filter:blur(10px)}
html[dir="rtl"] .hero-glow{inset:-40% -10% auto auto}
.hero-grid{position:relative;display:grid;grid-template-columns:auto minmax(0,1fr);gap:clamp(1.2rem,3.5vw,3rem);align-items:center}
.gauge-wrap{display:grid;place-items:center}
.hero .gauge{width:clamp(13rem,22vw,17rem)}
.gauge .ticks{stroke:var(--muted);opacity:.45}
.gauge .knob-o{fill:#fff;opacity:.95;filter:drop-shadow(0 0 6px var(--a2))}
.gauge .knob-i{fill:var(--a1)}
#knob{transform-origin:100px 100px;transition:transform 1.1s cubic-bezier(.2,.8,.2,1)}
.hero .pct{font-size:3.2rem}
.hero-head{display:flex;align-items:center;justify-content:space-between;gap:.6rem;flex-wrap:wrap;margin-bottom:.4rem}
.eyebrow{display:inline-flex;align-items:center;gap:.5rem;font-weight:700;color:var(--text2);font-size:.9rem}
.eyebrow svg{width:1.1rem;height:1.1rem;color:var(--a2)}
.eyebrow em{font-style:normal}
.big{display:flex;align-items:baseline;gap:.7rem;flex-wrap:wrap;direction:ltr;justify-content:flex-start}
html[dir="rtl"] .big{justify-content:flex-end}
.big b{font-size:clamp(2.2rem,5vw,3.4rem);font-weight:800;line-height:1.1;letter-spacing:-.04em;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.big .of{color:var(--muted);font-size:1rem}
.big .of em{font-style:normal}
.big .of strong{color:var(--text);font-weight:700;direction:ltr;display:inline-block}
.stack{display:flex;height:.8rem;border-radius:99px;background:var(--line);overflow:hidden;margin:1.1rem 0 1rem;direction:ltr}
.stack i{display:block;height:100%;width:0;transition:width 1.1s cubic-bezier(.2,.8,.2,1)}
.s-down{background:linear-gradient(90deg,#7c3aed,#8b5cf6)}
.s-up{background:linear-gradient(90deg,#06b6d4,#22d3ee)}
.legend{list-style:none;display:grid;gap:.5rem}
.legend li{display:grid;grid-template-columns:auto 1fr auto auto;align-items:center;gap:.7rem;padding:.65rem .9rem;border-radius:14px;background:var(--card-strong);border:1px solid var(--line)}
.lg{width:.7rem;height:.7rem;border-radius:50%}
.lg-down{background:#8b5cf6;box-shadow:0 0 10px #8b5cf6}
.lg-up{background:#22d3ee;box-shadow:0 0 10px #22d3ee}
.lg-rem{background:var(--muted);opacity:.7}
.legend .lt{font-size:.85rem;color:var(--text2)}
.legend .lt em{font-style:normal}
.legend b{direction:ltr;font-weight:700;font-size:.95rem}
.legend small{min-width:2.8rem;text-align:end;color:var(--muted);font-weight:600;direction:ltr;font-size:.78rem}

/* details list */
.ttl{display:inline-flex;align-items:center;gap:.5rem}
.ttl svg{width:1.1rem;height:1.1rem;color:var(--a2)}
.details{list-style:none;display:grid;gap:.5rem}
.details li{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:.7rem;padding:.6rem .8rem;border-radius:14px;background:var(--card-strong);border:1px solid var(--line)}
.di{width:2rem;height:2rem;border-radius:10px;display:grid;place-items:center;background:rgba(139,92,246,.16);color:var(--a1)}
.di svg{width:1.05rem;height:1.05rem}
.dk{font-size:.82rem;color:var(--text2)}
.details b{font-size:.88rem;font-weight:700;text-align:end;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.details .mono{font-family:var(--mono);direction:ltr;font-size:.8rem}
.exp-meta{display:flex;justify-content:space-between;gap:.5rem;margin-top:.45rem;font-size:.74rem;color:var(--muted)}
.exp-meta span:first-child{direction:ltr;font-weight:700;color:var(--text2)}

/* expiry */
.sec-title{display:flex;align-items:center;justify-content:space-between;gap:.6rem;margin-bottom:.9rem;font-weight:700}
.sec-title small{font-weight:400;color:var(--muted);font-size:.8rem}
.exp-bar{height:.45rem;border-radius:9px;background:var(--line);margin-top:1rem;overflow:hidden}
.exp-bar i{display:block;height:100%;width:0;background:var(--grad);border-radius:9px;transition:width 1s}
.exp-date{margin-top:.6rem;font-size:.82rem;color:var(--text2);display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap}
.unl{display:none;text-align:center;padding:1rem 0;font-size:1.15rem;font-weight:700}
.unl big{display:block;font-size:2.6rem;line-height:1;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}

/* sub link */
.linkbox{display:flex;gap:.5rem;align-items:stretch;flex-wrap:wrap}
@media (max-width:700px){.linkbox .url{flex:1 1 100%;order:-1}.linkbox .copyin{flex:1;width:auto;height:2.7rem}}
.url{
  flex:1;min-width:0;direction:ltr;text-align:left;font-family:var(--mono);font-size:.78rem;color:var(--text2);
  background:var(--card-strong);border:1px dashed var(--line);border-radius:14px;padding:.75rem .9rem;
  overflow-x:auto;overflow-y:hidden;text-overflow:clip;white-space:nowrap;display:block;line-height:1.5;user-select:text;-webkit-user-select:text;cursor:text;scrollbar-width:none;-webkit-overflow-scrolling:touch;touch-action:pan-x
}
.url::-webkit-scrollbar{display:none}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:.45rem;padding:.65rem 1.1rem;border-radius:14px;
  border:1px solid var(--line);background:var(--card-strong);color:var(--text);cursor:pointer;font:inherit;font-weight:700;font-size:.85rem;
  transition:.18s;text-decoration:none;white-space:nowrap
}
.btn:hover{transform:translateY(-2px);border-color:var(--a2)}
.btn.primary{background:var(--grad);border-color:transparent;color:#fff;box-shadow:none}
.btn svg{width:1.05rem;height:1.05rem}
.extras{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:1rem}
.copyin{flex:none;width:2.9rem;border-radius:14px;border:0;background:var(--grad);color:#fff;cursor:pointer;display:grid;place-items:center;box-shadow:none;transition:.18s}
.copyin:hover{transform:translateY(-2px)}.copyin:active{transform:scale(.94)}
.copyin svg{width:1.15rem;height:1.15rem}


/* configs */
.cfg-list{display:grid;gap:.65rem}
.cfg{
  display:grid;grid-template-columns:auto 1fr auto;gap:.8rem;align-items:center;padding:.8rem .9rem;border-radius:16px;
  background:var(--card-strong);border:1px solid var(--line);transition:.18s
}
.cfg:hover{border-color:var(--a1)}
.proto{
  min-width:3.6rem;text-align:center;padding:.35rem .5rem;border-radius:10px;font-size:.68rem;font-weight:800;letter-spacing:.04em;text-transform:uppercase;
  background:rgba(139,92,246,.18);color:var(--a1);direction:ltr
}
.cfg-info{min-width:0}
.cfg-name{font-weight:700;font-size:.92rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cfg-link{font-family:var(--mono);font-size:.68rem;color:var(--muted);direction:ltr;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cfg-act{display:flex;gap:.4rem}
.cfg-act .ibtn{width:2.3rem;height:2.3rem;border-radius:11px}
.empty{text-align:center;color:var(--muted);padding:2rem 0}

/* apps */
.tabs{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:.9rem}
.tab{display:inline-flex;align-items:center;gap:.4rem;padding:.45rem .95rem;border-radius:99px;border:1px solid var(--line);background:transparent;color:var(--text2);cursor:pointer;font:inherit;font-size:.82rem;font-weight:600;transition:.18s}
.tab.active{background:var(--grad);color:#fff;border-color:transparent}
.apps{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:.65rem}
.app{
  display:flex;align-items:center;justify-content:space-between;gap:.6rem;padding:.8rem 1rem;border-radius:16px;text-decoration:none;color:var(--text);
  background:var(--card-strong);border:1px solid var(--line);font-weight:700;font-size:.9rem;transition:.18s
}
.app:hover{border-color:var(--a2);transform:translateY(-2px)}
.app small{display:block;font-weight:400;font-size:.72rem;color:var(--muted)}
.app svg{width:1rem;height:1rem;color:var(--a2);flex:none}

/* modal + toast */
.modal{position:fixed;inset:0;z-index:50;display:none;place-items:center;padding:1rem;background:rgba(3,5,12,.7);backdrop-filter:blur(8px)}
.modal.show{display:grid}
.modal-box{width:min(100%,21rem);text-align:center;padding:1.4rem;border-radius:24px;background:var(--card-strong);border:1px solid var(--line);box-shadow:var(--shadow);animation:pop .22s ease}
@keyframes pop{from{transform:scale(.92);opacity:0}}
.qr{background:#fff;border-radius:18px;padding:.9rem;margin:0 auto .9rem;width:fit-content}
.qr svg,.qr img{display:block;width:min(70vw,15rem);height:auto}
.qr-title{font-weight:700;margin-bottom:.8rem;font-size:.95rem;word-break:break-word}
.toast{
  position:fixed;left:50%;bottom:max(1.2rem,env(safe-area-inset-bottom));transform:translate(-50%,20px);opacity:0;pointer-events:none;z-index:99;
  padding:.65rem 1.2rem;border-radius:99px;background:var(--text);color:var(--bg);font-weight:700;font-size:.85rem;transition:.22s
}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:900px){
  .two{grid-template-columns:1fr}
  .hero-grid{grid-template-columns:1fr;justify-items:stretch}
  .tiles{grid-template-columns:1fr 1fr 1fr}
}
/* narrow screens: tabs move to a fixed bottom bar */
@media (max-width:700px){
  body{padding-bottom:calc(5.6rem + env(safe-area-inset-bottom))}
  .nav{
    position:fixed;left:.75rem;right:.75rem;bottom:max(.75rem,env(safe-area-inset-bottom));z-index:40;width:auto;margin:0;
    justify-content:space-between;gap:.2rem;padding:.4rem;border-radius:22px;background:var(--card-strong);
    box-shadow:0 -6px 30px -10px rgba(0,0,0,.5),var(--shadow)
  }
  .nav-btn{flex:1;flex-direction:column;gap:.15rem;padding:.5rem .2rem;font-size:.7rem;border-radius:16px}
  .nav-btn svg{width:1.35rem;height:1.35rem}
  .toast{bottom:calc(5.8rem + env(safe-area-inset-bottom))}
}
@media (max-width:560px){
  .tiles{grid-template-columns:1fr}
  .tile{display:flex;align-items:center;justify-content:space-between}
  .tile .v{margin-top:0}
  .cfg{grid-template-columns:1fr auto}
  .proto{grid-column:1/-1;justify-self:start}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* ======== theme switch ======== */
.switch{--scale:1.25;direction:ltr;flex:none;-webkit-tap-highlight-color:transparent}
.switch {
  position: relative;
  display: inline-block;
  width: calc(var(--scale) * 60px);
  height: calc(var(--scale) * 34px);
}

.switch #themeInput {
  opacity: 0;
  width: 0;
  height: 0;
}

.slider {
  position: absolute;
  cursor: pointer;
  inset: 0;
  background-color: #2196f3;
  transition: 0.4s;
  z-index: 0;
  overflow: hidden;
}

.sun-moon {
  position: absolute;
  content: "";
  height: calc(var(--scale) * 26px);
  width: calc(var(--scale) * 26px);
  left: calc(var(--scale) * 4px);
  bottom: calc(var(--scale) * 4px);
  background-color: yellow;
  transition: 0.4s;
}

#themeInput:checked + .slider {
  background-color: black;
}

#themeInput:checked + .slider .sun-moon {
  transform: translateX(calc(var(--scale) * 26px));
  background-color: white;
  animation: rotate-center 0.6s ease-in-out both;
}

.moon-dot {
  opacity: 0;
  transition: 0.4s;
  fill: gray;
}
#themeInput:checked + .slider .sun-moon .moon-dot {
  opacity: 1;
}

.slider.round {
  border-radius: calc(var(--scale) * 34px);
}
.slider.round .sun-moon {
  border-radius: 50%;
}

#moon-dot-1 {
  left: calc(var(--scale) * 10px);
  top: calc(var(--scale) * 3px);
  position: absolute;
  width: calc(var(--scale) * 6px);
  height: calc(var(--scale) * 6px);
  z-index: 4;
}

#moon-dot-2 {
  left: calc(var(--scale) * 2px);
  top: calc(var(--scale) * 10px);
  position: absolute;
  width: calc(var(--scale) * 10px);
  height: calc(var(--scale) * 10px);
  z-index: 4;
}

#moon-dot-3 {
  left: calc(var(--scale) * 16px);
  top: calc(var(--scale) * 18px);
  position: absolute;
  width: calc(var(--scale) * 3px);
  height: calc(var(--scale) * 3px);
  z-index: 4;
}

#light-ray-1,
#light-ray-3,
#light-ray-2 {
  position: absolute;
  z-index: -1;
  fill: white;
  opacity: 10%;
}
#light-ray-1 {
  left: calc(var(--scale) * -8px);
  top: calc(var(--scale) * -8px);
  width: calc(var(--scale) * 43px);
  height: calc(var(--scale) * 43px);
}
#light-ray-2 {
  left: -50%;
  top: -50%;
  width: calc(var(--scale) * 55px);
  height: calc(var(--scale) * 55px);
}
#light-ray-3 {
  left: calc(var(--scale) * -18px);
  top: calc(var(--scale) * -18px);
  width: calc(var(--scale) * 60px);
  height: calc(var(--scale) * 60px);
}

.cloud-light,
.cloud-dark {
  position: absolute;
  animation-name: cloud-move;
  animation-duration: 6s;
  animation-iteration-count: infinite;
}
.cloud-light {
  fill: #eee;
}
.cloud-dark {
  fill: #ccc;
  animation-delay: 1s;
}

#cloud-1 {
  left: calc(var(--scale) * 30px);
  top: calc(var(--scale) * 15px);
  width: calc(var(--scale) * 40px);
}
#cloud-2 {
  left: calc(var(--scale) * 44px);
  top: calc(var(--scale) * 10px);
  width: calc(var(--scale) * 20px);
}
#cloud-3 {
  left: calc(var(--scale) * 18px);
  top: calc(var(--scale) * 24px);
  width: calc(var(--scale) * 30px);
}
#cloud-4 {
  left: calc(var(--scale) * 36px);
  top: calc(var(--scale) * 18px);
  width: calc(var(--scale) * 40px);
}
#cloud-5 {
  left: calc(var(--scale) * 48px);
  top: calc(var(--scale) * 14px);
  width: calc(var(--scale) * 20px);
}
#cloud-6 {
  left: calc(var(--scale) * 22px);
  top: calc(var(--scale) * 26px);
  width: calc(var(--scale) * 30px);
}

@keyframes cloud-move {
  0% {
    transform: translateX(0px);
  }
  40% {
    transform: translateX(calc(var(--scale) * 4px));
  }
  80% {
    transform: translateX(calc(var(--scale) * -4px));
  }
  100% {
    transform: translateX(0px);
  }
}

.stars {
  transform: translateY(calc(var(--scale) * -32px));
  opacity: 0;
  transition: 0.4s;
}

.star {
  fill: white;
  position: absolute;
  transition: 0.4s;
  animation-name: star-twinkle;
  animation-duration: 2s;
  animation-iteration-count: infinite;
}

#themeInput:checked + .slider .stars {
  transform: translateY(0);
  opacity: 1;
}

#star-1 {
  width: calc(var(--scale) * 20px);
  top: calc(var(--scale) * 2px);
  left: calc(var(--scale) * 3px);
  animation-delay: 0.3s;
}
#star-2 {
  width: calc(var(--scale) * 6px);
  top: calc(var(--scale) * 16px);
  left: calc(var(--scale) * 3px);
}
#star-3 {
  width: calc(var(--scale) * 12px);
  top: calc(var(--scale) * 20px);
  left: calc(var(--scale) * 10px);
  animation-delay: 0.6s;
}
#star-4 {
  width: calc(var(--scale) * 18px);
  top: calc(var(--scale) * 0px);
  left: calc(var(--scale) * 18px);
  animation-delay: 1.3s;
}

@keyframes star-twinkle {
  0% {
    transform: scale(1);
  }
  40% {
    transform: scale(1.2);
  }
  80% {
    transform: scale(0.8);
  }
  100% {
    transform: scale(1);
  }
}

.switch:has(#themeInput:focus-visible){outline:2px solid var(--a1);outline-offset:3px;border-radius:999px}
.switch .slider{box-shadow:inset 0 3px 6px hsl(0 0% 0% / .35)}
@media (prefers-reduced-motion:reduce){.switch *{animation:none!important}}

/* surfaces */
.card{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);box-shadow:none}
.card,.nav,.btn,.ibtn,.mini,.legend li,.details li,.cfg,.app,.url,.tab,.chip,.modal-box,.stack,.exp-bar{transition:background-color .5s ease,border-color .5s ease,color .5s ease,transform .18s ease}
.mini,.legend li,.details li,.cfg,.app,.url,.tab,.chip.neutral{background:var(--well);border:1.5px solid var(--line);box-shadow:none}
.stack,.exp-bar{background:var(--track);box-shadow:none;border:0}
.hero-glow{display:none}
.modal-box{background:var(--card-strong);border:1.5px solid var(--line);box-shadow:var(--card-shadow)}
.toast{background:var(--text);color:var(--bg);box-shadow:var(--card-shadow)}

/* buttons */
.btn{background:var(--well);border:1.5px solid var(--line);box-shadow:none;border-radius:99px;color:var(--text)}
.btn:hover{border-color:var(--a1);transform:translateY(-2px)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--act-bg);color:var(--act-fg);border-color:transparent}
.ibtn{background:var(--well);border:1.5px solid var(--line);box-shadow:none;border-radius:50%;color:var(--text)}
.ibtn:hover{border-color:var(--a1);transform:translateY(-2px)}
.nav{background:var(--card);border:1.5px solid var(--line);box-shadow:var(--card-shadow);border-radius:999px;padding:.4rem;backdrop-filter:blur(14px) saturate(1.25);-webkit-backdrop-filter:blur(14px) saturate(1.25)}
.nav-btn{border-radius:999px;color:var(--text2)}
.nav-btn.active,.tab.active{background:var(--act-bg);color:var(--act-fg);border-color:transparent;box-shadow:none}
.cfg:hover{border-color:var(--a1)}

/* banner = a wide version of the switch scene */
.banner{position:relative;overflow:hidden;isolation:isolate;border:0;color:#fff;background:linear-gradient(170deg,#1565c0 0%,#1e88e5 62%,#3aa0f3 100%)}
.banner::before{content:"";position:absolute;inset:0;z-index:-2;background:linear-gradient(170deg,#000 0%,#0b1220 50%,#1a2b50 100%);opacity:0;transition:opacity .6s ease}
html[data-theme="dark"] .banner::before{opacity:1}
.banner-sky{position:absolute;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
.bs-cloud{position:absolute;aspect-ratio:100/52;height:auto;fill:#fff;opacity:.26;translate:0 0;transition:opacity .5s ease,translate .5s ease;animation:cloudMove 7s ease-in-out infinite}
html[data-theme="dark"] .bs-cloud{opacity:0;translate:0 16px}
.bs-star{position:absolute;aspect-ratio:1;height:auto;fill:#fff;opacity:0;translate:0 -14px;transition:opacity .5s ease,translate .5s ease;animation:starTwinkle 2s ease-in-out infinite}
html[data-theme="dark"] .bs-star{opacity:1;translate:0 0}
@keyframes cloudMove{0%{transform:translateX(0)}40%{transform:translateX(14px)}80%{transform:translateX(-12px)}100%{transform:translateX(0)}}
@keyframes starTwinkle{0%{transform:scale(1)}40%{transform:scale(1.25)}80%{transform:scale(.75)}100%{transform:scale(1)}}
.banner .brand h1{color:#fff;text-shadow:0 1px 3px rgba(0,30,80,.35)}
.banner .who{color:rgba(255,255,255,.92);text-shadow:0 1px 2px rgba(0,30,80,.35)}
.banner .chip{background:rgba(255,255,255,.2);color:#fff;border:1px solid rgba(255,255,255,.38);text-shadow:none}
.banner .chip.on .dot{color:#7dffb0}
.banner .chip.off{background:rgba(255,70,100,.4)}
.banner .ibtn{background:rgba(255,255,255,.2);color:#fff;border:1px solid rgba(255,255,255,.4)}
.banner .announce{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.24);box-shadow:none;color:#fff}
.banner .announce{align-items:center;gap:.6rem;padding:.45rem .8rem .45rem .45rem;border-radius:16px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.banner .announce .an-ic{width:2rem;height:2rem;border-radius:11px;flex:none;display:grid;place-items:center;background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.35)}
.banner .announce .an-ic svg{width:1.05rem;height:1.05rem;margin:0;color:#fff}
.banner .announce #announceText{flex:1;min-width:0;font-size:.8rem;font-weight:600;line-height:1.6;overflow-wrap:anywhere;text-shadow:0 1px 6px rgba(0,30,90,.35)}
html[dir="rtl"] .banner .announce{padding:.45rem .45rem .45rem .8rem}
.switch .slider{box-shadow:0 0 0 2px rgba(255,255,255,.55)}

/* logo: round badge with soft rings; the user's own SVG/picture sits inside (first letter when none is set) */
.logo{position:relative;flex:none;width:3.4rem;height:3.4rem;border-radius:50%;overflow:visible;display:grid;place-items:center;padding:0;
  background:#fff;color:#1565c0;font-weight:800;font-size:1.45rem;line-height:1;border:0;
  box-shadow:0 0 0 .55rem rgba(255,255,255,.14),0 0 0 1.1rem rgba(255,255,255,.08)}
.logo img{position:absolute;inset:.45rem;width:calc(100% - .9rem);height:calc(100% - .9rem);object-fit:contain;display:block;border-radius:50%}
.logo.has-img{background:#fff}
.logo .lg-av .lg-d{fill:#d9e6fb;transition:fill .5s ease}
html[data-theme="dark"] .logo .lg-av .lg-d{fill:#33427a}
.logo .lg-av{width:100%;height:100%;display:block;color:#1c274c;transition:color .5s ease}
.logo{transition:background-color .5s ease}
html[data-theme="dark"] .logo{background:#1c274c;box-shadow:0 0 0 .55rem rgba(255,255,255,.12),0 0 0 1.1rem rgba(255,255,255,.06)}
html[data-theme="dark"] .logo .lg-av{color:#dfe7ff}
html[data-theme="dark"] .logo.has-img{background:#fff}
.logo.has-img .lg-av{display:none}

/* data colours */
.big b,.unl big{background:var(--grad-text);-webkit-background-clip:text;background-clip:text;color:transparent}
.s-down,.lg-down{background:var(--c-down)}
.s-up,.lg-up{background:var(--c-up)}
.lg-down,.lg-up{box-shadow:none}
.lg-rem{background:var(--muted)}
.exp-bar i{background:linear-gradient(90deg,var(--c-up),var(--c-down))}
.gauge .track{stroke:var(--track)}
.gauge .ticks{stroke:var(--muted);opacity:.5}
.gauge .bar{filter:none}
.gauge .knob-o{fill:#ffd21f;filter:none;opacity:1}
.gauge .knob-i{fill:#fff}
html[data-theme="dark"] .gauge .knob-o{fill:#fff}
html[data-theme="dark"] .gauge .knob-i{fill:#aeb7c7}
.proto{background:color-mix(in srgb,var(--a1) 15%,transparent);color:var(--a1)}
.di{background:color-mix(in srgb,var(--a1) 15%,transparent);color:var(--a1)}
@media (max-width:700px){.nav{background:var(--card-strong);border-radius:30px;padding:.4rem}.nav-btn{border-radius:24px}}
@media (max-width:700px){.bs-cloud{opacity:.13}}
/* sliding tab indicator */
.nav{position:relative}
.nav-ind{position:absolute;top:0;left:0;width:0;height:0;z-index:0;pointer-events:none;border-radius:999px;background:var(--act-bg);box-shadow:0 6px 16px -8px var(--a1);opacity:0;
  transition:transform .32s cubic-bezier(.32,.72,0,1),width .32s cubic-bezier(.32,.72,0,1),height .2s ease,background .5s ease,opacity .2s ease}
.nav-ind.ready{opacity:1}
.nav-ind.noanim{transition:none}
.nav .nav-btn{position:relative;z-index:1;transition:color .2s ease}
.nav .nav-btn.active{background:transparent;box-shadow:none;color:var(--act-fg)}
@media (max-width:700px){.nav{position:fixed}.nav-ind{border-radius:24px}}
@media (prefers-reduced-motion:reduce){.nav-ind{transition:none}}
/* gauge: clean ring, one centred stack */
.gauge-center{gap:.2rem;text-align:center;align-content:center;justify-items:center}
.gauge-center .pct{display:inline-flex;align-items:baseline;justify-content:center;gap:.12rem;direction:ltr;line-height:1}
.hero .gauge-center .pct{font-size:3.4rem}
.gauge-center .pct small{font-size:1.25rem;font-weight:700;color:var(--text2)}
.gauge-center>span{margin-top:0;font-size:.85rem;font-weight:600;color:var(--muted)}
/* Persian: numbers read right-to-left with the unit on their left */
.big b .u{font-size:.4em;font-weight:700;margin-inline-start:.3em;letter-spacing:0}
html[lang="fa"] .big{direction:rtl;justify-content:flex-start}
html[lang="fa"] .big .of strong,html[lang="fa"] .legend b{direction:rtl}
html[dir="rtl"] .legend small{text-align:left}
html[lang="fa"] .big b{letter-spacing:0}
/* subscription extras */
.extras{display:grid;grid-template-columns:minmax(0,1fr);gap:.65rem;margin-top:.9rem}
.xbtn{display:flex;align-items:center;gap:.7rem;padding:.7rem .85rem;border-radius:18px;background:var(--well);border:1.5px solid var(--line);color:var(--text);cursor:pointer;font:inherit;text-align:start;text-decoration:none;transition:border-color .2s ease,background-color .2s ease,transform .12s ease;min-width:0}
.xbtn:hover{border-color:var(--a1)}
.xbtn:active{transform:scale(.98)}
.xi{width:2.5rem;height:2.5rem;border-radius:13px;display:grid;place-items:center;flex:none;background:color-mix(in srgb,var(--a1) 16%,transparent);color:var(--a1)}
.xi svg{width:1.25rem;height:1.25rem}
.xt{display:grid;min-width:0;line-height:1.4}
.xt b,.xt small{white-space:nowrap}
.xt b{font-size:.92rem;font-weight:700}
.xt small{font-size:.74rem;color:var(--muted);font-weight:500}
.xgo{margin-inline-start:auto;width:1.05rem;height:1.05rem;color:var(--muted);flex:none}
.xbtn.support{grid-column:1/-1}

.extras-w{container:ext/inline-size}
html[dir="rtl"] .xgo.out{transform:scaleX(-1)}

/* apps */
.apps-hint{display:flex;align-items:flex-start;gap:.65rem;padding:.75rem .95rem;border-radius:16px;background:var(--well);border:1.5px solid var(--line);color:var(--text2);font-size:.83rem;line-height:1.75;margin-bottom:.9rem}
.apps-hint svg{width:1.15rem;height:1.15rem;flex:none;margin-top:.3rem;color:var(--a1)}
.apps{grid-template-columns:repeat(auto-fill,minmax(16.5rem,1fr));gap:.75rem;margin-top:0}
.appc{display:grid;gap:.85rem;padding:.95rem;border-radius:20px;background:var(--well);border:1.5px solid var(--line);min-width:0;transition:border-color .2s ease}
.appc:hover{border-color:var(--a1)}
.appc-top{display:flex;align-items:center;gap:.75rem;min-width:0}
.appc-ic{width:2.9rem;height:2.9rem;border-radius:15px;display:grid;place-items:center;font-weight:800;font-size:1.2rem;color:#fff;flex:none;direction:ltr}
.appc-nm{min-width:0;line-height:1.45}
.appc-nm b{display:block;font-size:1rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.appc-nm small{color:var(--muted);font-size:.75rem}
.appc-tag{margin-inline-start:auto;font-size:.68rem;font-weight:700;padding:.15rem .6rem;border-radius:99px;background:color-mix(in srgb,var(--a1) 15%,transparent);color:var(--a1);white-space:nowrap}
.appc-act{display:grid;grid-template-columns:1fr auto;gap:.5rem}
.appc-act:has(.btn:only-child){grid-template-columns:1fr}
.appc-act .btn{padding:.6rem .85rem;font-size:.83rem}
.appc-act .btn svg{width:1rem;height:1rem}

/* ip check */
.ttl{display:inline-flex;align-items:center;gap:.5rem}
.ibtn-sm{width:2.2rem;height:2.2rem;border-radius:12px;border:1.5px solid var(--line);background:var(--well);color:var(--text2);display:grid;place-items:center;cursor:pointer;transition:.18s}
.ibtn-sm:hover{border-color:var(--a1);color:var(--a1)}.ibtn-sm svg{width:1.05rem;height:1.05rem}
.ibtn-sm.spin svg{animation:ipspin .8s cubic-bezier(.45,0,.25,1) infinite}@keyframes ipspin{to{transform:rotate(360deg)}}
.ipcard{grid-column:1/-1}
.ipmain{display:flex;align-items:center;gap:.85rem;padding:.75rem .9rem;border-radius:16px;background:var(--well);border:1.5px solid var(--line)}
.ipflag{flex:none;width:2.6rem;height:2.6rem;border-radius:14px;display:grid;place-items:center;background:color-mix(in srgb,var(--a1) 16%,transparent);color:var(--a1);transition:background-color .3s,color .3s}
.ipflag svg{width:1.4rem;height:1.4rem}
.ipflag.ok{background:rgba(34,197,94,.15);color:#16a34a}.ipflag.bad{background:rgba(245,158,11,.16);color:#d97706}.ipflag.err{background:rgba(239,68,68,.14);color:#dc2626}

  /**

  qrcode.createStringToBytes = function(unicodeData, numChars) {

      var bin = base64DecodeInputStream(unicodeData);
      var read = function() {
        var b = bin.read();
        if (b == -1) throw 'eof';
        return b;
      };

      var count = 0;
      var unicodeMap = {};
      while (true) {
        var b0 = bin.read();
        if (b0 == -1) break;
        var b1 = read();
        var b2 = read();
        var b3 = read();
        var k = String.fromCharCode( (b0 << 8) | b1);
        var v = (b2 << 8) | b3;
        unicodeMap[k] = v;
        count += 1;
      }
      if (count != numChars) {
        throw count + ' != ' + numChars;
      }

      return unicodeMap;
    }();

    var unknownChar = '?'.charCodeAt(0);

    return function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        if (c < 128) {
          bytes.push(c);
        } else {
          var b = unicodeMap[s.charAt(i)];
          if (typeof b == 'number') {
            if ( (b & 0xff) == b) {
              // 1byte
              bytes.push(b);
            } else {
              // 2bytes
              bytes.push(b >>> 8);
              bytes.push(b & 0xff);
            }
          } else {
            bytes.push(unknownChar);
          }
        }
      }
      return bytes;
    };

      if (el.classList.contains('lknob')) return false;
      if (el.closest('.banner-sky')) return false;
      if (el.closest('svg') && el.tagName.toLowerCase() !== 'svg') return false;
      return true;
    });
  }
  // a structural address (tag + position among siblings, from .wrap down) lets an element that the re-render
  // rebuilt from scratch find the old element it replaces, so rebuilt lists and rows glide like everything else
  function sigOf(el, cache){
    if (el === root || !el) return '';
    var c = cache.get(el); if (c !== undefined) return c;
    var i = 0, n = el; while ((n = n.previousElementSibling)) i++;
    c = sigOf(el.parentElement, cache) + '/' + el.tagName + i; cache.set(el, c); return c;
  }
  function ownText(el){ var t = ''; for (var n = el.firstChild; n; n = n.nextSibling) if (n.nodeType === 3) t += n.nodeValue; return t.trim(); }
  var els = reduce ? [] : items(), old = new Map(), oldText = new Map(), oldSet = new Set(els), oldBySig = new Map(), sc1 = new Map();
  els.forEach(function(el){
    var r = el.getBoundingClientRect();
    if (r.width || r.height) { old.set(el, r); var t = ownText(el); if (t) oldText.set(el, t); oldBySig.set(sigOf(el, sc1), { el: el, r: r, t: t }); }
  });
  var ind = document.getElementById('navInd'); ind.classList.add('noanim');
  change();
  try { moveInd(); } catch(e){}
  void ind.offsetWidth;
  setTimeout(function(){ ind.classList.remove('noanim'); }, 60);
  if (reduce) return;
  var d = new Map();
  old.forEach(function(r0, el){
    var r1 = el.getBoundingClientRect();
    if (!(r1.width || r1.height)) return;
    d.set(el, { x: r0.left - r1.left, y: r0.top - r1.top });
  });
  // rebuilt elements: take the place (and text) of the old element at the same address
  var fresh = [], freshSet = new Set(), matched = new Set(), sc2 = new Map(), textFx = [];
  items().forEach(function(el){
    if (oldSet.has(el) || !(el.offsetWidth || el.offsetHeight) || el.closest('.banner-sky')) return;
    fresh.push(el); freshSet.add(el);
    var m = oldBySig.get(sigOf(el, sc2));
    if (m && !m.el.isConnected) {
      var r1 = el.getBoundingClientRect();
      d.set(el, { x: m.r.left - r1.left, y: m.r.top - r1.top }); matched.add(el);
      var t1 = ownText(el); if (t1 && t1 !== m.t) textFx.push(el);
    }
  });
  d.forEach(function(v, el){
    var p = el.parentElement, pv = p && d.get(p) || { x: 0, y: 0 };
    var dx = v.x - pv.x, dy = v.y - pv.y;
    if (Math.abs(dx) < .5 && Math.abs(dy) < .5) return;
    try { el.animate([{ transform: 'translate(' + dx + 'px,' + dy + 'px)' }, { transform: 'translate(0,0)' }], { duration: 520, easing: 'cubic-bezier(.32,.72,0,1)', composite: 'add' }); } catch(e){}
  });
  // every piece of text that changed language also fades in, wherever it sits
  var fade = [{ opacity: 0, transform: 'translateY(5px)' }, { opacity: 1, transform: 'translateY(0)' }];
  var fadeOpt = { duration: 380, easing: 'cubic-bezier(.32,.72,0,1)', composite: 'add' };
  oldText.forEach(function(t0, el){
    if (!el.isConnected) return;
    var t1 = ownText(el);
    if (t1 && t1 !== t0) { try { el.animate(fade, fadeOpt); } catch(e){} }
  });
  textFx.forEach(function(el){ try { el.animate(fade, fadeOpt); } catch(e){} });
  // brand-new elements with nothing to replace fade in
  fresh.forEach(function(el){
    if (matched.has(el)) return;
    var par = el.parentElement; if (par && freshSet.has(par) && !matched.has(par)) return;
    try { el.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 380, easing: 'ease-out' }); } catch(e){}
  });
}
$('langInput').onchange = function(){
  var nl = this.checked ? 'fa' : 'en', kn = document.querySelector('.lknob');
  try{localStorage.setItem('hub-lang',nl)}catch(e){}
  kn.classList.remove('squish'); void kn.offsetWidth; kn.classList.add('squish');
  flipSwap(function(){ lang = nl; render(); });
};
$('themeInput').onchange = function(){ theme = this.checked ? 'dark' : 'light'; try{localStorage.setItem('hub-theme',theme)}catch(e){} render(); };

/* ---------- keep page end-padding in step with the real nav height ---------- */
(function(){
  var nav = $('nav');
  function fit(){ document.documentElement.style.setProperty('--nav-h', nav.offsetHeight + 'px'); }
  fit(); window.addEventListener('resize', fit);
  if (window.ResizeObserver) new ResizeObserver(fit).observe(nav);
})();

/* ---------- config search ---------- */
$('cfgQ').addEventListener('input', function(){ cfgQ = this.value; renderConfigs(); });
$('cfgQx').onclick = function(){ cfgQ = ''; renderConfigs(); $('cfgQ').focus(); };

/* ---------- connection state ---------- */
var fails = 0, netOk = true, netT;
function netShow(ok){
  var n = $('net'); clearTimeout(netT);
  n.hidden = false; n.classList.toggle('ok', ok);
  $('netTxt').textContent = ok ? T('netBack') : T('netLost'); $('netBtn').textContent = T('netRetry');
  void n.offsetWidth; n.classList.add('show');
  if (ok) netT = setTimeout(function(){ n.classList.remove('show'); setTimeout(function(){ n.hidden = true; }, 400); }, 1800);
}
function netSet(ok){ if (ok === netOk) return; netOk = ok; netShow(ok); }
function netFail(){ fails++; if (fails >= 2 || !navigator.onLine) netSet(false); }
window.addEventListener('offline', function(){ fails = 2; netSet(false); });
window.addEventListener('online', function(){ refresh(true); });
$('netBtn').onclick = function(){ refresh(true); };

/* ---------- live refresh via ?format=info ---------- */
function refresh(force){
  var ac = window.AbortController ? new AbortController() : null, to = ac && setTimeout(function(){ ac.abort(); }, 8000);
  fetch(location.pathname + '?format=info', { headers: { 'Accept': 'application/json' }, cache: 'no-store', signal: ac ? ac.signal : undefined })
    .then(function(r){ return r.ok ? r.json() : null; })
    .then(function(j){
      clearTimeout(to);
      if (!j) { netFail(); return; }
      fails = 0; netSet(true);
      if (j.used != null) D.used = j.used;
      if (j.remained != null) D.remained = j.remained;
      if (j.download != null) D.download = j.download;
      if (j.upload != null) D.upload = j.upload;
      if (j.downloadByte != null) D.downB = +j.downloadByte;
      if (j.uploadByte != null) D.upB = +j.uploadByte;
      if (j.totalByte != null) D.totalB = +j.totalByte;
      if (j.enabled != null) D.enabled = !!j.enabled;
      if (j.isOnline != null) D.online = !!j.isOnline;
      if (j.lastOnline != null) D.lastOnline = +j.lastOnline;
      if (j.expire != null) D.expire = +j.expire;
      render();
    }).catch(function(){ clearTimeout(to); netFail(); });
}

render();
try{ var sp = sessionStorage.getItem('hub-page'); if (sp && document.getElementById('page-' + sp)) showPage(sp); }catch(e){}
// tick exactly when the remaining seconds roll over, so every digit flips on the beat (no skipped or doubled seconds)
(function loop(){
  tick();
  var l = D.expire > 0 ? D.expire * 1000 - Date.now() : 0;
  setTimeout(loop, l > 0 ? (l % 1000) + 15 : 1000);
})();
setInterval(refresh, 15000);
})();
